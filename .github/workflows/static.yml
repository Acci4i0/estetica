# Deploys the static site (index.html, styles.css, script.js, img/) to GitHub Pages,
# after writing the treatments from data/ into index.html (scripts/build.mjs)
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch, including the edits saved from the Pages CMS panel
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # sharp shrinks the photos uploaded from the panel; it goes outside the checkout so it
      # isn't published, and if it fails to install the photos are simply left as they are
      - name: Build the page from data/
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund --prefix "$RUNNER_TEMP/tools" sharp@0.35.5 || echo "sharp not installed"
          node scripts/build.mjs --foto
        env:
          SHARP_DIR: ${{ runner.temp }}/tools
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
