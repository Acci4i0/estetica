# Il pannello di Paola: Pages CMS (https://app.pagescms.org) legge questo file e le fa modificare
# i trattamenti in data/trattamenti/, un file per area. Ogni salvataggio è un commit su main e
# GitHub ripubblica il sito (vedi .github/workflows/static.yml). Layout e grafica restano nel codice.

media:
  input: img/trattamenti
  output: img/trattamenti
  extensions: [jpg, jpeg, png, webp]
  rename: safe

settings:
  commit:
    templates:
      create: "Pannello: aggiunto {path}"
      update: "Pannello: aggiornato {path}"
      delete: "Pannello: eliminato {path}"
      rename: "Pannello: {oldPath} rinominato in {newPath}"

components:
  trattamenti:
    type: object
    label: Trattamenti
    description: Tocca un trattamento per aprirlo. Trascinalo per cambiare il suo posto nella pagina.
    list:
      collapsible:
        collapsed: true
        summary: "{nome}"
    fields:
      # usato nei link (…/#t-hydra-glow): resta lo stesso anche se il nome cambia
      - name: id
        type: string
        hidden: true
      - name: nome
        label: Nome
        type: string
        required: true
        options:
          maxlength: 50
      - name: prezzo
        label: Prezzo in euro
        type: number
        description: Solo il numero, per esempio 60. Se lo lasci vuoto, il prezzo non compare.
        options:
          min: 0
      - name: prezzo_da
        label: Prezzo di partenza
        type: boolean
        description: Acceso, davanti al prezzo compare «da» (per esempio «da 15 €»), utile quando il prezzo cambia in base alla zona.
      - name: durata
        label: Durata
        type: string
        description: Per esempio «50 min». Se la durata non è fissa, due o tre parole come «A zona».
        options:
          maxlength: 20
      - name: descrizione
        label: Descrizione
        type: text
        required: true
        description: Due o tre frasi. Una riga vuota comincia un nuovo paragrafo.
        options:
          maxlength: 600
      - name: foto
        label: Foto
        type: image
        description: Meglio verticale. Il sito la ritaglia e la alleggerisce da solo; senza foto compare la crema.
      - name: prodotti
        label: Prodotti usati
        type: select
        description: Facoltativi. Compaiono nella scheda del trattamento, con la loro foto.
        options:
          multiple: true
          placeholder: Scegli i prodotti
