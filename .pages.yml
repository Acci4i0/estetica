            label: Titolo
            type: string
            description: Per esempio «Video viso».
            options:
              maxlength: 30
          - name: link
            label: Link
            type: string
            pattern:
              regex: "^https?://\\S+$"
              message: Incolla l'indirizzo completo, che comincia con https://

content:
  - name: trattamenti
    label: Trattamenti
    type: group
    items:
      - name: viso
        label: Viso
        type: file
        path: data/trattamenti/viso.json
        format: json
        operations: { create: false, delete: false }
        fields:
          - name: trattamenti
            component: trattamenti
      - name: corpo
        label: Corpo e massaggi
        type: file
        path: data/trattamenti/corpo.json
        format: json
        operations: { create: false, delete: false }
        fields:
          - name: trattamenti
            component: trattamenti
      - name: epilazione
        label: Epilazione
        type: file
        path: data/trattamenti/epilazione.json
        format: json
        operations: { create: false, delete: false }
        fields:
          - name: trattamenti
            component: trattamenti
      - name: pedicure
        label: Pedicure
        type: file
        path: data/trattamenti/pedicure.json
        format: json
        operations: { create: false, delete: false }
        fields:
          - name: trattamenti
            component: trattamenti
      - name: tecnologia
        label: Tecnologia
        type: file
        path: data/trattamenti/tecnologia.json
        format: json
        operations: { create: false, delete: false }
        fields:
